<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>绘画作品集 · Material 3</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --surface: #FDFBFE;
    --surface-dim: #EFE8F5;
    --surface-container-lowest: #FFFFFF;
    --surface-container-low: #FAF5FD;
    --surface-container: #F5EDFA;
    --surface-container-high: #F0E5F8;
    --surface-container-highest: #EADFF4;
    --on-surface: #241E2C;
    --on-surface-variant: #5E5569;
    --outline: #8C8297;
    --outline-variant: #DDD3E8;
    --primary: #9376DE;
    --on-primary: #FFFFFF;
    --primary-container: #EFE3FC;
    --on-primary-container: #2E1B4D;
    --danger: #B44876;
    --grad-page: linear-gradient(165deg, #FCE9F4 0%, #F2EBFD 48%, #E8F3FE 100%);
    --grad-splash: linear-gradient(160deg, #F9D7EC 0%, #E4D7F9 50%, #D3E9FC 100%);
    --grad-button: linear-gradient(118deg, #F177AE 0%, #A87BE8 52%, #6F9BF2 100%);
    --grad-chip: linear-gradient(110deg, #FBD8EA 0%, #E2D8F9 55%, #D6E8FC 100%);
  }

  html, body { min-height: 100%; }
  body {
    font-family: "Roboto", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(150deg, #FBEAF3 0%, #F0E9FB 45%, #E4F1FC 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; color: var(--on-surface);
    overflow-y: auto;
  }

  .phone {
    width: 375px; height: 812px; flex: 0 0 auto; position: relative; overflow: hidden;
    background: var(--surface); border-radius: 34px;
    box-shadow: 0 24px 60px rgba(120, 95, 175, .24), 0 2px 6px rgba(90, 70, 140, .12);
  }

  .page {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    background: var(--grad-page); opacity: 0; pointer-events: none;
    transform: translateX(12px); transition: opacity .28s ease, transform .28s ease;
  }
  .page.active { opacity: 1; pointer-events: auto; transform: none; }

  .caption { font-size: 12px; color: #6E6280; letter-spacing: .3px; }

  /* ---------------- 启动页 ---------------- */
  #page-splash {
    background: var(--grad-splash);
    align-items: center; justify-content: center; gap: 18px;
  }
  .bow { animation: bowIn .8s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes bowIn {
    from { opacity: 0; transform: scale(.86); }
    to   { opacity: 1; transform: scale(1); }
  }
  .splash-caption {
    font-size: 14px; letter-spacing: 6px; color: #4C3C63;
    animation: fadeUp .8s .18s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------------- 首页 ---------------- */
  .top-bar { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; }
  .search {
    flex: 1; height: 52px; border-radius: 26px; padding: 0 16px;
    background: rgba(255, 255, 255, .78);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: flex; align-items: center; gap: 10px;
    transition: box-shadow .2s ease, background .2s ease;
  }
  .search:focus-within {
    background: #FFFFFF;
    box-shadow: 0 0 0 2px var(--primary);
  }
  .search svg { flex-shrink: 0; }
  .search input {
    width: 100%; border: none; outline: none; background: transparent;
    font: inherit; font-size: 14px; color: var(--on-surface);
  }
  .search input::placeholder { color: var(--on-surface-variant); }

  .icon-btn {
    width: 48px; height: 48px; flex-shrink: 0; border: none; border-radius: 50%;
    background: rgba(255, 255, 255, .62); color: var(--on-surface-variant);
    display: grid; place-items: center; cursor: pointer;
    transition: background .18s ease;
  }
  .icon-btn:active { background: rgba(255, 255, 255, .92); }

  .feed { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  .feed::-webkit-scrollbar { width: 0; }
  .columns { display: flex; align-items: flex-start; gap: 12px; padding: 8px 16px 16px; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }

  .card {
    background: var(--surface-container-lowest); border-radius: 16px;
    overflow: hidden; cursor: pointer;
    box-shadow: 0 2px 8px rgba(139, 108, 190, .14);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card:active { transform: scale(.983); box-shadow: 0 1px 4px rgba(139, 108, 190, .16); }
  .thumb { width: 100%; background: var(--surface-container); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-meta { padding: 9px 11px 11px; display: flex; flex-direction: column; gap: 5px; }
  .card-title {
    font-size: 14px; font-weight: 600; line-height: 20px; color: var(--on-surface);
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .card-views {
    display: flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--on-surface-variant);
  }

  .empty {
    display: none; flex-direction: column; align-items: center; gap: 6px;
    padding: 72px 24px; text-align: center; color: var(--on-surface-variant);
  }
  .empty.show { display: flex; }
  .empty-title { font-size: 15px; font-weight: 600; color: var(--on-surface); }

  .net-banner {
    display: none; align-items: center; gap: 10px;
    margin: 8px 16px 0; padding: 10px 12px; border-radius: 14px;
    background: rgba(255, 255, 255, .86);
    box-shadow: inset 0 0 0 1.5px rgba(180, 72, 118, .26);
    color: var(--danger); font-size: 12px; line-height: 17px;
  }
  .net-banner.show { display: flex; }
  .net-banner-text { flex: 1; min-width: 0; }
  .net-banner button {
    flex-shrink: 0; border: none; cursor: pointer; font-family: inherit;
    padding: 6px 14px; border-radius: 999px;
    background: linear-gradient(135deg, #F177AE, #A87BE8 55%, #6F9BF2);
    color: #fff; font-size: 12px; font-weight: 600;
  }
  .net-banner button:disabled { opacity: .55; cursor: default; }

  .home-bottom {
    padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
    background: rgba(253, 251, 255, .82);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 -1px 0 rgba(168, 143, 205, .22);
  }
  .upload-btn {
    width: 100%; height: 52px; border: none; border-radius: 26px;
    background: var(--grad-button); color: #FFFFFF;
    font: inherit; font-size: 15px; font-weight: 600; letter-spacing: .5px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    cursor: pointer; box-shadow: 0 6px 16px rgba(140, 100, 210, .32);
    transition: box-shadow .18s ease, transform .18s ease;
  }
  .upload-btn:active { transform: translateY(1px); box-shadow: 0 3px 8px rgba(140, 100, 210, .30); }
  .file-input { display: none; }

  /* ---------------- 详情页 ---------------- */
  .app-bar {
    height: 64px; display: flex; align-items: center; gap: 4px;
    padding: 0 16px 0 8px; background: transparent;
  }
  .app-bar .icon-btn { background: transparent; color: var(--on-surface); }
  .app-bar-title { font-size: 17px; font-weight: 600; letter-spacing: .2px; }

  .detail-body {
    flex: 1; overflow-y: auto; padding: 0 16px 96px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .detail-body::-webkit-scrollbar { width: 0; }

  .hero {
    width: 100%; border-radius: 24px; overflow: hidden;
    background: rgba(255, 255, 255, .62);
    display: flex; align-items: center; justify-content: center;
  }
  .hero img { width: 100%; max-height: 420px; object-fit: contain; display: block; }

  .views-row {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--on-surface-variant);
  }
  .views-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--grad-chip); border-radius: 999px;
    padding: 6px 12px; font-size: 12px; color: #3B2F4C;
  }
  .views-chip strong { color: #241E2C; font-weight: 600; }

  .field {
    background: rgba(255, 255, 255, .72); border-radius: 14px;
    padding: 8px 14px 10px; display: flex; flex-direction: column; gap: 2px;
    transition: box-shadow .2s ease, background .2s ease;
  }
  .field:focus-within {
    background: #FFFFFF;
    box-shadow: 0 0 0 2px var(--primary);
  }
  .field-label { font-size: 11px; letter-spacing: .6px; color: var(--on-surface-variant); }
  .field input, .field textarea {
    border: none; outline: none; background: transparent; resize: none;
    font: inherit; font-size: 15px; line-height: 22px; color: var(--on-surface);
    padding: 0;
  }
  .field textarea { min-height: 76px; }

  .detail-actions {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; gap: 10px; padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    background: rgba(253, 251, 255, .86);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 -1px 0 rgba(168, 143, 205, .22);
  }
  .btn {
    height: 48px; border-radius: 24px; border: none; cursor: pointer;
    font: inherit; font-size: 14px; font-weight: 600; letter-spacing: .4px;
    transition: transform .16s ease, opacity .16s ease;
  }
  .btn:active { transform: scale(.975); }
  .btn-tonal {
    flex: 1.2; background: var(--grad-button); color: #FFFFFF;
    box-shadow: 0 6px 16px rgba(140, 100, 210, .28);
  }
  .btn-danger {
    flex: 1; background: rgba(255, 255, 255, .62); color: var(--danger);
    box-shadow: inset 0 0 0 1.5px var(--danger);
  }

  /* ---------------- 提示条 ---------------- */
  .snackbar {
    position: absolute; left: 16px; right: 16px; bottom: 88px;
    display: flex; align-items: center; gap: 12px;
    background: #2B2338; color: #F7EFF8; border-radius: 14px;
    padding: 12px 16px; font-size: 13px;
    opacity: 0; transform: translateY(12px); pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
    z-index: 10;
  }
  .snackbar.show { opacity: 1; transform: none; pointer-events: auto; }
  .snackbar-text { flex: 1; }
  .snackbar-action {
    border: none; background: transparent; color: #FFCFE6;
    font: inherit; font-size: 13px; font-weight: 700; letter-spacing: .5px; cursor: pointer;
  }

  /* ---------------- 真机（窄屏）适配 ---------------- */
  @media (max-width: 480px) {
    body { display: block; padding: 0; overflow: hidden; }
    .phone {
      width: 100%; height: 100vh; height: 100dvh;
      border-radius: 0; box-shadow: none;
    }
    .caption { display: none; }
    .snackbar { bottom: calc(88px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<div class="phone" id="phone">

  <!-- ================= 启动页 ================= -->
  <section id="page-splash" class="page active">
    <svg class="bow" width="140" height="90" viewBox="0 0 150 96" aria-label="蝴蝶结 Logo">
      <g fill="none" stroke="#241E2C" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
        <path d="M38 25 C28 24 25 30 25 38 L25 62 C25 72 29 77 39 77 L74 58 L74 42 Z" />
        <path d="M112 25 C122 24 125 30 125 38 L125 62 C125 72 121 77 111 77 L76 58 L76 42 Z" />
      </g>
      <rect x="67.5" y="35" width="15" height="28" rx="4" fill="#241E2C" />
    </svg>
    <p class="splash-caption">绘画作品集</p>
  </section>

  <!-- ================= 首页 ================= -->
  <section id="page-home" class="page">
    <header class="top-bar">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E5569" stroke-width="1.8">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="M15.5 15.5 L20 20" />
        </svg>
        <input id="search-input" type="search" placeholder="搜索作品标题" autocomplete="off" />
      </div>
      <button id="filter-btn" class="icon-btn" type="button" aria-label="筛选">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 7 H20 M7 12 H17 M10 17 H14" />
        </svg>
      </button>
    </header>

    <div class="net-banner" id="net-banner" role="alert">
      <span class="net-banner-text" id="net-banner-text">本机存储读取失败，作品未能加载</span>
      <button id="net-retry" type="button">重试</button>
    </div>

    <main class="feed">
      <div class="columns" id="columns">
        <div class="col"></div>
        <div class="col"></div>
      </div>
      <div class="empty" id="empty">
        <span class="empty-title">没有找到作品</span>
        <span>换个关键词试试</span>
      </div>
    </main>

    <footer class="home-bottom">
      <button id="upload-btn" class="upload-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5 V19 M5 12 H19" />
        </svg>
        上传图片
      </button>
      <input id="file-input" class="file-input" type="file" accept="image/*" multiple />
    </footer>
  </section>

  <!-- ================= 作品详情 ================= -->
  <section id="page-detail" class="page">
    <header class="app-bar">
      <button id="back-btn" class="icon-btn" type="button" aria-label="返回">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M15 4 L7 12 L15 20" />
        </svg>
      </button>
      <span class="app-bar-title">作品详情</span>
    </header>

    <div class="detail-body">
      <div class="hero"><img id="detail-img" alt="" /></div>

      <div class="views-row">
        <span class="views-chip">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M2 12 C6 5 18 5 22 12 C18 19 6 19 2 12 Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          浏览量 <strong id="detail-views">0</strong>
        </span>
      </div>

      <label class="field">
        <span class="field-label">标题</span>
        <input id="detail-title" type="text" />
      </label>

      <label class="field">
        <span class="field-label">作品描述</span>
        <textarea id="detail-desc" rows="4" placeholder="写下这幅作品的创作想法…"></textarea>
      </label>
    </div>

    <footer class="detail-actions">
      <button id="download-btn" class="btn btn-tonal" type="button">下载图片</button>
      <button id="delete-btn" class="btn btn-danger" type="button">删除作品</button>
    </footer>
  </section>

  <!-- ================= 提示条 ================= -->
  <div class="snackbar" id="snackbar">
    <span class="snackbar-text" id="snackbar-text"></span>
    <button class="snackbar-action" id="snackbar-action" type="button"></button>
  </div>

</div>

<p class="caption">双列瀑布流 · 底部上传 · 详情可改标题/描述 · 点开作品浏览量 +1</p>

<script>
  const IMG = 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt={p}&image_size={s}';

  /* ============ 本机持久化（IndexedDB） ============ */
  const DB_NAME = 'painting-gallery';
  const STORE = 'works';
  let dbPromise = null;

  function openDb() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE)) {
          db.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
        }
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
    return dbPromise;
  }

  function idbAdd(record) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        const tx = db.transaction(STORE, 'readwrite');
        const req = tx.objectStore(STORE).add(record);
        req.onsuccess = function () { resolve(req.result); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  function idbPut(record) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(record);
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  function idbGet(id) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        const req = db.transaction(STORE, 'readonly').objectStore(STORE).get(id);
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
      });
    });
  }

  function idbDelete(id) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).delete(id);
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  function idbAll() {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        const req = db.transaction(STORE, 'readonly').objectStore(STORE).getAll();
        req.onsuccess = function () { resolve(req.result || []); };
        req.onerror = function () { reject(req.error); };
      });
    });
  }


  // 作品数据（演示内容）
  const works = [
    {
      id: 1, title: '橘猫的午后', views: 326, ratio: '4 / 3',
      desc: '午后三点的窗台，橘猫把自己摊成一块暖面包。水彩，2024 年春。',
      src: IMG.replace('{p}', 'watercolor%20painting%20of%20an%20orange%20tabby%20cat%20napping%20on%20a%20sunlit%20windowsill%2C%20soft%20warm%20light%2C%20loose%20brushstrokes').replace('{s}', 'landscape_4_3')
    },
    {
      id: 2, title: '夏日气泡', views: 241, ratio: '1 / 1',
      desc: '泳池边的气泡，是夏天该有的颜色。',
      src: IMG.replace('{p}', 'impressionist%20painting%20of%20summer%20bubbles%20floating%20above%20a%20turquoise%20pool%2C%20bright%20sunlight%2C%20pastel%20palette').replace('{s}', 'square')
    },
    {
      id: 3, title: '蓝色清晨', views: 158, ratio: '3 / 4',
      desc: '清晨湖面的蓝，层次很浅，像还没有醒透。',
      src: IMG.replace('{p}', 'oil%20painting%20of%20a%20misty%20lake%20at%20dawn%2C%20cool%20blue%20tones%2C%20minimal%20composition').replace('{s}', 'portrait_4_3')
    },
    {
      id: 4, title: '窗边的绿', views: 187, ratio: '4 / 5',
      desc: '窗台上那盆绿萝，逆光时的轮廓最好看。',
      src: IMG.replace('{p}', 'oil%20painting%20of%20green%20houseplants%20by%20a%20sunlit%20window%2C%20muted%20greens%2C%20morning%20light').replace('{s}', 'portrait_4_3')
    },
    {
      id: 5, title: '旧书店', views: 92, ratio: '5 / 6',
      desc: '老书店的木格窗与暖黄灯，记忆里的味道。',
      src: IMG.replace('{p}', 'oil%20painting%20of%20an%20old%20bookstore%20interior%2C%20wooden%20shelves%2C%20warm%20amber%20lamplight%2C%20nostalgic%20mood').replace('{s}', 'portrait_4_3')
    },
    {
      id: 6, title: '雨后街角', views: 73, ratio: '4 / 3',
      desc: '雨后的柏油路，把路灯又画了一遍。',
      src: IMG.replace('{p}', 'oil%20painting%20of%20a%20rainy%20street%20corner%20at%20dusk%2C%20wet%20pavement%20reflections%2C%20moody%20city%20lights').replace('{s}', 'landscape_4_3')
    },
    {
      id: 7, title: '陶罐', views: 47, ratio: '3 / 4',
      desc: '陶罐与木桌，土色系静物练习。',
      src: IMG.replace('{p}', 'still%20life%20oil%20painting%20of%20a%20clay%20pot%20on%20a%20wooden%20table%2C%20earth%20tones%2C%20soft%20shadows').replace('{s}', 'portrait_4_3')
    },
    {
      id: 8, title: '山脊线', views: 55, ratio: '16 / 9',
      desc: '远处山脊一层层退去，最远的那层只剩雾。',
      src: IMG.replace('{p}', 'oil%20painting%20of%20layered%20mountain%20ridges%20in%20mist%2C%20muted%20palette%2C%20distant%20peaks').replace('{s}', 'landscape_4_3')
    }
  ];

  let currentId = null;

  const columns = document.getElementById('columns');
  const emptyState = document.getElementById('empty');
  const searchInput = document.getElementById('search-input');
  const netBanner = document.getElementById('net-banner');
  const netBannerText = document.getElementById('net-banner-text');
  const netRetry = document.getElementById('net-retry');

  function showNetBanner(message) {
    netBannerText.textContent = message;
    netBanner.classList.add('show');
  }

  function hideNetBanner() {
    netBanner.classList.remove('show');
  }

  netRetry.addEventListener('click', function () {
    netRetry.disabled = true;
    netRetry.textContent = '加载中';
    loadLocalWorks().then(function () {
      netRetry.disabled = false;
      netRetry.textContent = '重试';
    });
  });

  function go(name) {
    document.querySelectorAll('.page').forEach(function (p) {
      p.classList.remove('active');
    });
    document.getElementById(name).classList.add('active');
  }

  function cardTemplate(work) {
    const card = document.createElement('article');
    card.className = 'card';
    card.dataset.id = work.id;

    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    thumb.style.aspectRatio = work.ratio;

    const img = new Image();
    img.src = work.src;
    img.alt = work.title;
    thumb.appendChild(img);

    const meta = document.createElement('div');
    meta.className = 'card-meta';

    const title = document.createElement('span');
    title.className = 'card-title';
    title.textContent = work.title || '未命名作品';

    const views = document.createElement('span');
    views.className = 'card-views';
    views.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
      '<path d="M2 12 C6 5 18 5 22 12 C18 19 6 19 2 12 Z" /><circle cx="12" cy="12" r="3" /></svg>' +
      '<span>' + work.views + '</span>';

    meta.appendChild(title);
    meta.appendChild(views);
    card.appendChild(thumb);
    card.appendChild(meta);
    card.addEventListener('click', function () { openDetail(work.id); });
    return card;
  }

  function render() {
    const query = searchInput.value.trim();
    const list = works.filter(function (w) {
      return !query || w.title.indexOf(query) !== -1;
    });

    columns.querySelectorAll('.col').forEach(function (col) { col.innerHTML = ''; });
    emptyState.classList.toggle('show', list.length === 0);

    const cols = columns.querySelectorAll('.col');
    list.forEach(function (work) {
      let target = cols[0];
      Array.prototype.forEach.call(cols, function (col) {
        if (col.offsetHeight < target.offsetHeight) target = col;
      });
      target.appendChild(cardTemplate(work));
    });
  }

  function openDetail(id) {
    const work = works.find(function (w) { return w.id === id; });
    if (!work) return;

    currentId = id;
    work.views += 1;
    saveLocal(work, { views: work.views });

    document.getElementById('detail-img').src = work.src;
    document.getElementById('detail-img').alt = work.title;
    document.getElementById('detail-views').textContent = work.views;
    document.getElementById('detail-title').value = work.title;
    document.getElementById('detail-desc').value = work.desc || '';

    const card = document.querySelector('.card[data-id="' + id + '"]');
    if (card) {
      card.querySelector('.card-title').textContent = work.title;
      card.querySelector('.card-views span:last-child').textContent = work.views;
    }
    go('page-detail');
  }

  /* 标题 / 描述实时保存 */
  document.getElementById('detail-title').addEventListener('input', function (e) {
    const work = works.find(function (w) { return w.id === currentId; });
    if (!work) return;
    work.title = e.target.value;
    scheduleSave(work, { title: work.title });
    const card = document.querySelector('.card[data-id="' + currentId + '"]');
    if (card) card.querySelector('.card-title').textContent = work.title || '未命名作品';
  });

  document.getElementById('detail-desc').addEventListener('input', function (e) {
    const work = works.find(function (w) { return w.id === currentId; });
    if (work) {
      work.desc = e.target.value;
      scheduleSave(work, { description: work.desc });
    }
  });

  document.getElementById('back-btn').addEventListener('click', function () {
    render();
    go('page-home');
  });

  /* 下载 */
  document.getElementById('download-btn').addEventListener('click', function () {
    const work = works.find(function (w) { return w.id === currentId; });
    if (!work) return;
    const a = document.createElement('a');
    a.href = work.src;
    a.download = (work.title || '作品') + '.png';
    a.target = '_blank';
    a.rel = 'noopener';
    a.click();
    toast('已开始下载「' + (work.title || '作品') + '」', '', null);
  });

  /* 删除（支持撤销） */
  document.getElementById('delete-btn').addEventListener('click', function () {
    const index = works.findIndex(function (w) { return w.id === currentId; });
    if (index === -1) return;

    const removed = works.splice(index, 1)[0];
    if (removed.localId) removed.deletePromise = deleteLocal(removed);
    render();
    go('page-home');
    toast('已删除「' + removed.title + '」', '撤销', function () {
      works.splice(index, 0, removed);
      render();
      if (removed.localId) restoreLocal(removed);
    });
  });

  /* 上传 */
  const fileInput = document.getElementById('file-input');
  document.getElementById('upload-btn').addEventListener('click', function () {
    fileInput.click();
  });

  fileInput.addEventListener('change', function (e) {
    Array.prototype.forEach.call(e.target.files, function (file) {
      uploadFile(file).catch(function (err) {
        toast('保存失败：' + (err && err.message ? err.message : '本机存储不可用'), '', null);
      });
    });
    fileInput.value = '';
  });

  /* ============ 本机持久化（IndexedDB 存取） ============ */

  function fileRatio(file) {
    return new Promise(function (resolve) {
      const url = URL.createObjectURL(file);
      const probe = new Image();
      probe.onload = function () {
        resolve(probe.naturalWidth + ' / ' + probe.naturalHeight);
        URL.revokeObjectURL(url);
      };
      probe.onerror = function () {
        resolve('4 / 3');
        URL.revokeObjectURL(url);
      };
      probe.src = url;
    });
  }

  async function loadLocalWorks() {
    try {
      const rows = await idbAll();
      const known = {};
      works.forEach(function (w) { if (w.localId) known[w.localId] = true; });
      const items = rows
        .filter(function (row) { return !known[row.id]; })
        .sort(function (a, b) { return b.createdAt - a.createdAt; })
        .map(function (row) {
          return {
            id: 'local-' + row.id,
            localId: row.id,
            title: row.title || '未命名作品',
            views: row.views || 0,
            desc: row.desc || '',
            ratio: row.ratio || '4 / 3',
            src: URL.createObjectURL(row.blob)
          };
        });
      works.unshift.apply(works, items);
      hideNetBanner();
      render();
    } catch (err) {
      showNetBanner('本机存储读取失败：' + (err && err.message ? err.message : '未知原因'));
    }
  }

  async function uploadFile(file) {
    const title = file.name.replace(/\.[^.]+$/, '') || '我的作品';
    const ratio = await fileRatio(file);
    const localId = await idbAdd({
      title: title,
      desc: '',
      views: 0,
      ratio: ratio,
      blob: file,
      createdAt: Date.now()
    });
    works.unshift({
      id: 'local-' + localId,
      localId: localId,
      title: title,
      views: 0,
      desc: '',
      ratio: ratio,
      src: URL.createObjectURL(file)
    });
    searchInput.value = '';
    render();
    document.querySelector('.feed').scrollTop = 0;
    toast('已保存到本机「' + title + '」', '', null);
  }

  function saveLocal(work, patch) {
    if (!work.localId) return;
    idbGet(work.localId).then(function (row) {
      if (!row) return;
      if (patch.title !== undefined) row.title = patch.title;
      if (patch.description !== undefined) row.desc = patch.description;
      if (patch.views !== undefined) row.views = patch.views;
      return idbPut(row);
    }).catch(function () {});
  }

  const saveTimers = {};
  function scheduleSave(work, patch) {
    if (!work.localId) return;
    clearTimeout(saveTimers[work.id]);
    saveTimers[work.id] = setTimeout(function () {
      saveLocal(work, patch);
    }, 700);
  }

  function deleteLocal(work) {
    return idbGet(work.localId).then(function (row) {
      if (!row) return;
      work.record = row;
      return idbDelete(work.localId);
    });
  }

  async function restoreLocal(work) {
    try {
      if (work.deletePromise) await work.deletePromise;
      if (work.record) await idbPut(work.record);
      render();
    } catch (err) {
      toast('撤销失败：本机记录未恢复', '', null);
    }
  }

  /* 搜索与筛选 */
  searchInput.addEventListener('input', render);

  document.getElementById('filter-btn').addEventListener('click', function () {
    toast('筛选功能将在后续版本接入', '', null);
  });

  /* 提示条 */
  let snackTimer = null;
  const snackbar = document.getElementById('snackbar');
  const snackText = document.getElementById('snackbar-text');
  const snackAction = document.getElementById('snackbar-action');

  function hideSnackbar() {
    snackbar.classList.remove('show');
    clearTimeout(snackTimer);
  }

  function toast(text, actionText, onAction) {
    clearTimeout(snackTimer);
    snackText.textContent = text;
    snackAction.textContent = actionText || '';
    snackAction.style.display = actionText ? 'inline' : 'none';
    snackAction.onclick = function () {
      if (onAction) onAction();
      hideSnackbar();
    };
    snackbar.classList.add('show');
    snackTimer = setTimeout(hideSnackbar, 3600);
  }

  /* 启动页停留 1 秒进入首页 */
  setTimeout(function () {
    render();
    go('page-home');
  }, 1000);

  render();
  loadLocalWorks();
</script>
</body>
</html>
